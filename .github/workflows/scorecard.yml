name: scorecard

# OSSF Scorecard publishes a security posture score to scorecard.dev.
# Results are uploaded as SARIF to GitHub Code Scanning, so findings appear in
# the repo's Security tab in addition to the public badge.
#
# The first run after pushing populates the badge URL at
# https://api.scorecard.dev/projects/github.com/yipjunkai/secrets-spotter/badge.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions per OSSF Scorecard recommendation; per-job elevations below.
permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to GitHub Code Scanning
      id-token: write # OIDC token to publish results to OSSF
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif

      - name: Upload SARIF as artifact (debug/audit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
